name: Credit Risk Dashboard
on:
  push:
    branches: [main]
    paths: ['scanner.py', 'runner.py', 'quality.py', 'tests/**', 'requirements.txt', 'site/index.html', '.github/workflows/dashboard.yml', '.github/workflows/scan-batch.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: credit-risk-dashboard
  cancel-in-progress: true
jobs:
  quick_scan:
    uses: ./.github/workflows/scan-batch.yml
    with:
      count: 4
      budget: 240
      ancillary: true
      artifact: quick-pages
  followup_scan:
    needs: quick_scan
    uses: ./.github/workflows/scan-batch.yml
    with:
      count: ${{ github.event_name == 'schedule' && 20 || 8 }}
      budget: 480
      ancillary: false
      artifact: followup-pages
