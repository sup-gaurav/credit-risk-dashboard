name: Credit Risk Dashboard
run-name: Credit Risk Scan ${{ inputs.request_id || github.run_number }}
on:
  push:
    branches: [main]
    paths: ['ordered_scan.py', 'employer_sources.py', 'config/employers.csv', 'scanner.py', 'quality.py', 'freshness.py', 'tests/**', 'requirements.txt', 'site/index.html', 'site/github-scan.js', '.github/workflows/**']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      requested_by:
        type: string
        default: manual
      request_id:
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: credit-risk-dashboard
  cancel-in-progress: false
jobs:
  ordered_scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run LinkedIn then Indeed then 100 employers then final screening
        id: scan
        continue-on-error: true
        env:
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
          PYTHONUNBUFFERED: '1'
        run: python ordered_scan.py
      - name: Preserve resumable state
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/ordered-state.json ]; then
            git add data/ordered-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save ordered scan state'
              git push origin HEAD:main
            fi
          fi
      - name: Save final snapshot after the full attempt pass
        if: steps.scan.outcome == 'success'
        run: |
          git add site/jobs.json site/coverage.json site/scan-status.json site/digest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish final ordered scan snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: steps.scan.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.scan.outcome == 'success'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.scan.outcome == 'success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordered-scan-checkpoint
          path: data/ordered-state.json
          if-no-files-found: warn
          retention-days: 7
      - name: Flag paused or failed work without publishing new results
        if: steps.scan.outcome != 'success'
        run: exit 1
